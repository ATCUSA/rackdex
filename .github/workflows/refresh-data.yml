name: Refresh data

# Rebuilds and deploys the site when the device type library has new commits, so the baseline
# index stays close to upstream. Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets.

on:
  schedule:
    - cron: '23 6 * * *' # daily, 06:23 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Deploy even if the library has not changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - id: compare
        run: |
          upstream=$(git ls-remote https://github.com/netbox-community/devicetype-library.git refs/heads/master | cut -f1)
          [ -n "$upstream" ] || { echo "could not read upstream commit"; exit 1; }
          deployed=$(curl -fsS https://rackdex.acole.dev/data/index.json | jq -r '.meta.sha' || echo unknown)
          echo "upstream: $upstream"
          echo "deployed: $deployed"
          if [ "$FORCE" = "true" ] || [ "$upstream" != "$deployed" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          FORCE: ${{ inputs.force }}

  deploy:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build index
        run: pnpm index

      - run: pnpm test

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Build site
        run: pnpm exec vite build

      - name: Deploy
        run: pnpm dlx wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
