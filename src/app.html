<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>RackDex — NetBox device type search</title>
		<meta name="description" content="Fast search for the NetBox Device Type Library. Find any device, module or rack type and copy import-ready YAML in one click." />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="RackDex" />
		<meta property="og:title" content="RackDex — Gotta rack 'em all." />
		<meta property="og:description" content="Fast search for the NetBox Device Type Library. Copy import-ready YAML in one click." />
		<meta property="og:url" content="https://rackdex.acole.dev/" />
		<meta property="og:image" content="https://rackdex.acole.dev/og.png" />
		<meta property="og:image:width" content="1280" />
		<meta property="og:image:height" content="640" />
		<meta name="twitter:card" content="summary_large_image" />
		<script>
			try {
				if (localStorage.getItem('dtf-theme') === 'light')
					document.documentElement.classList.remove('dark');
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="bg-zinc-50 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
